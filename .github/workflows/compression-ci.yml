name: PDF compression checks

on:
  push:
    branches: [main, feature/local-pdf-compression, feature/multiple-cuts-2026-11-15, feature/multitool-compression-2026-11-16]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Test PDF compression engine
        run: npm test
      - name: Build production PWA
        run: npm run build
      - name: Install Chromium for browser integration tests
        run: npx playwright install --with-deps chromium
      - name: Test real compression in Chromium
        run: npm run test:browser
      - name: Verify bundled compression engine and offline shell
        run: |
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          find dist/assets -name '*.wasm' | grep -q .
          grep -q 'mode-compress' dist/index.html
